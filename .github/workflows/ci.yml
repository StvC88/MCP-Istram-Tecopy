name: CI
on:
  push:
    branches: [main, codex/istram-stable]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        shell: bash
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.txt
      - name: Record compilation diagnostics on development branch
        if: failure() && matrix.os == 'ubuntu-latest' && matrix.node == '24' && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p .ci
          cp typecheck.txt .ci/typecheck.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/typecheck.txt
          git commit -m "Record compilation diagnostics" || exit 0
          git push origin HEAD:codex/istram-stable
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee tests.txt
      - name: Record test diagnostics on development branch
        if: failure() && matrix.os == 'ubuntu-latest' && matrix.node == '24' && github.event_name == 'push' && github.ref == 'refs/heads/codex/istram-stable'
        shell: bash
        run: |
          test -f tests.txt || exit 0
          mkdir -p .ci
          cp tests.txt .ci/tests.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/tests.txt
          git commit -m "Record test diagnostics" || exit 0
          git push origin HEAD:codex/istram-stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r python/requirements.txt
      - name: IFC and worker tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:python 2>&1 | tee python-tests.txt
      - name: Record Python diagnostics on development branch
        if: failure() && matrix.os == 'ubuntu-latest' && matrix.node == '24' && github.event_name == 'push' && github.ref == 'refs/heads/codex/istram-stable'
        shell: bash
        run: |
          test -f python-tests.txt || exit 0
          mkdir -p .ci
          cp python-tests.txt .ci/python-tests.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/python-tests.txt
          git commit -m "Record Python diagnostics" || exit 0
          git push origin HEAD:codex/istram-stable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock-${{ matrix.os }}-${{ matrix.node }}
          path: package-lock.json
  lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/istram-stable'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate lock once
        run: |
          if test -f package-lock.json; then exit 0; fi
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock reproducible MCP dependencies"
          git push origin HEAD:codex/istram-stable
